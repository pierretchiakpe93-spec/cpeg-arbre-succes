name: Deploy site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preserve the currently published APK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://pierretchiakpe93-spec.github.io/cpeg-arbre-succes/gestion/application.apk" \
            --output gestion/application.apk
          test -s gestion/application.apk
      - name: Copy school logo
        run: cp android/app/src/main/res/drawable-nodpi/ic_launcher_logo.png gestion/school-logo.png
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
