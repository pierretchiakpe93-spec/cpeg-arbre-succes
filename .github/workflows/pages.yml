name: Deploy site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Android build dependencies
        run: pnpm install --frozen-lockfile
      - name: Copy web application
        run: pnpm run copy:web
      - name: Synchronize Android project
        run: pnpm exec cap sync android
      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-signing-key.p12
      - name: Find release key alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          alias=$(keytool -list -storetype PKCS12 -keystore android/app/release-signing-key.p12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -v | sed -n 's/^Alias name: //p' | head -n 1)
          test -n "$alias" || (echo "Could not read alias from release keystore" && exit 1)
          echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-signing-key.p12
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash ./gradlew assembleRelease -PappVersionCode="$(git -C .. rev-list --count HEAD)"
      - name: Add APK to downloadable site files
        run: cp android/app/build/outputs/apk/release/app-release.apk gestion/application.apk
      - name: Add school logo to downloadable site files
        run: cp android/app/src/main/res/drawable-nodpi/ic_launcher_logo.png gestion/school-logo.png
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
