<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800" role="img" aria-labelledby="title desc">
<title id="title">Guide d’inscription des enseignants</title><desc id="desc">Six étapes illustrées pour créer un compte enseignant sur le portail scolaire CS L’Arbre de Succès.</desc>
<rect width="1080" height="1800" fill="#f3f6fb"/><rect x="40" y="40" width="1000" height="1720" rx="40" fill="#fff" stroke="#dce4f0" stroke-width="3"/>
<rect x="40" y="40" width="1000" height="300" rx="40" fill="#142846"/><path d="M40 280h1000v60H40z" fill="#142846"/>
<circle cx="130" cy="130" r="52" fill="#fff"/><path d="M130 92a38 38 0 1 0 0 76 38 38 0 0 0 0-76" fill="none" stroke="#315dcc" stroke-width="6"/><path d="M130 130V105M130 130l20 10" stroke="#315dcc" stroke-width="6" stroke-linecap="round"/><circle cx="130" cy="130" r="5" fill="#315dcc"/>
<text x="210" y="112" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">CS L’ARBRE DE SUCCÈS</text><text x="210" y="165" fill="#d8e3f3" font-family="Arial,sans-serif" font-size="25">GUIDE D’INSCRIPTION DES ENSEIGNANTS</text><text x="95" y="245" fill="#fff" font-family="Arial,sans-serif" font-size="24">Suivez les étapes pour créer votre compte et accéder à la plateforme.</text>
<!-- Step 1 -->
<circle cx="115" cy="410" r="38" fill="#315dcc"/><text x="115" y="421" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">1</text><text x="175" y="400" fill="#172b45" font-family="Arial,sans-serif" font-size="29" font-weight="700">Demandez votre code</text><text x="175" y="442" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">Contactez l’administration pour recevoir un code</text><text x="175" y="475" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">d’invitation réservé au rôle « Enseignant ».</text>
<!-- Step 2 -->
<circle cx="115" cy="565" r="38" fill="#315dcc"/><text x="115" y="576" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">2</text><text x="175" y="555" fill="#172b45" font-family="Arial,sans-serif" font-size="29" font-weight="700">Ouvrez le formulaire</text><text x="175" y="597" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">Sur l’écran de connexion, appuyez sur</text><rect x="175" y="620" width="650" height="58" rx="14" fill="#edf2ff"/><text x="205" y="658" fill="#315dcc" font-family="Arial,sans-serif" font-size="22" font-weight="700">Créer un compte avec un code d’invitation</text>
<!-- Step 3 -->
<circle cx="115" cy="755" r="38" fill="#315dcc"/><text x="115" y="766" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">3</text><text x="175" y="745" fill="#172b45" font-family="Arial,sans-serif" font-size="29" font-weight="700">Renseignez vos informations</text>
<rect x="175" y="775" width="760" height="230" rx="22" fill="#f8faff" stroke="#dce4f0" stroke-width="2"/>
<text x="205" y="817" fill="#48566b" font-family="Arial,sans-serif" font-size="20" font-weight="700">Nom complet</text><rect x="205" y="831" width="700" height="48" rx="10" fill="#fff" stroke="#cad5e5"/><text x="225" y="863" fill="#7a8798" font-family="Arial,sans-serif" font-size="18">Votre prénom et votre nom</text>
<text x="205" y="916" fill="#48566b" font-family="Arial,sans-serif" font-size="20" font-weight="700">Adresse e-mail et numéro de téléphone</text><rect x="205" y="931" width="337" height="48" rx="10" fill="#fff" stroke="#cad5e5"/><text x="225" y="963" fill="#7a8798" font-family="Arial,sans-serif" font-size="18">E-mail utilisé par vous</text><rect x="558" y="931" width="347" height="48" rx="10" fill="#fff" stroke="#cad5e5"/><text x="578" y="963" fill="#7a8798" font-family="Arial,sans-serif" font-size="18">Téléphone (ex. +229…)</text>
<!-- Step 4 -->
<circle cx="115" cy="1075" r="38" fill="#315dcc"/><text x="115" y="1086" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">4</text><text x="175" y="1065" fill="#172b45" font-family="Arial,sans-serif" font-size="29" font-weight="700">Saisissez le code d’invitation</text><rect x="175" y="1095" width="760" height="70" rx="16" fill="#f8faff" stroke="#dce4f0" stroke-width="2"/><text x="205" y="1138" fill="#48566b" font-family="Arial,sans-serif" font-size="20" font-weight="700">Code d’invitation fourni par l’administration</text><text x="205" y="1168" fill="#8793a2" font-family="Arial,sans-serif" font-size="16">Le code attribue le rôle correspondant à votre compte.</text>
<!-- Step 5 -->
<circle cx="115" cy="1250" r="38" fill="#315dcc"/><text x="115" y="1261" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">5</text><text x="175" y="1240" fill="#172b45" font-family="Arial,sans-serif" font-size="29" font-weight="700">Créez et confirmez votre mot de passe</text><text x="175" y="1280" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">Choisissez au moins 8 caractères, puis saisissez-le</text><text x="175" y="1313" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">une deuxième fois dans « Confirmer le mot de passe ».</text>
<!-- Step 6 -->
<circle cx="115" cy="1400" r="38" fill="#315dcc"/><text x="115" y="1411" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">6</text><text x="175" y="1390" fill="#172b45" font-family="Arial,sans-serif" font-size="29" font-weight="700">Appuyez sur « S’inscrire »</text><text x="175" y="1432" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">Si un e-mail de confirmation est demandé, ouvrez-le</text><text x="175" y="1465" fill="#5d6b7e" font-family="Arial,sans-serif" font-size="23">et confirmez votre adresse, puis connectez-vous.</text>
<rect x="95" y="1530" width="890" height="145" rx="24" fill="#fff7e6" stroke="#f0d59a" stroke-width="2"/><text x="130" y="1575" fill="#805300" font-family="Arial,sans-serif" font-size="24" font-weight="700">À retenir</text><text x="130" y="1617" fill="#654d22" font-family="Arial,sans-serif" font-size="21">Gardez votre mot de passe secret. En cas de code refusé ou d’erreur,</text><text x="130" y="1649" fill="#654d22" font-family="Arial,sans-serif" font-size="21">demandez à l’administration de vérifier le code et votre adresse e-mail.</text>
<text x="540" y="1715" text-anchor="middle" fill="#728096" font-family="Arial,sans-serif" font-size="18">Portail de gestion scolaire · CS L’Arbre de Succès</text>
</svg>